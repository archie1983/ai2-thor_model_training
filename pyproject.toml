[project]
name = "ai2-thor-model-training"
version = "1.0.1"
description = "Training and navigation tools using AI2-THOR with custom neural networks"
authors = [
  { name = "Your Name", email = "your.email@example.com" }
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    # Add your actual dependencies here, e.g.:
    "numpy",
    "matplotlib",
#    "ai2thor",
    "tqdm",
#    "opencv-python",
    "Pillow",
    "shapely",
    "prior",
#    "ai2thor_colab",
    "moviepy==1.0.3"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
#    "ipykernel",
#    "jupyterlab",
#    "torch"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ai2_thor_model_training", "thortils"]
